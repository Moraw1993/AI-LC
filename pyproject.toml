[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-learning-lifecycle"
version = "0.1.0"
description = "Evidence-driven adaptive learning lifecycle for AI harnesses"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7"]

[project.scripts]
ailearn = "ailearn.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ailearn"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/README.md", "/CONTRIBUTING.md",
           "/LICENSE", "/AGENTS.md", "/pyproject.toml", "/uv.lock", "/.github", "/scripts"]
exclude = ["/docs/plan-review.md", "/docs/verification.md", "**/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", ".test-tmp*", ".smoke", ".wheel-venv", ".tool-store"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
