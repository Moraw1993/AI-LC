name: native-release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing annotated main release tag to publish or retry'
        required: false
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ailearn-windows-x64.exe
          - os: ubuntu-22.04
            asset: ailearn-linux-x64
          - os: ubuntu-24.04-arm
            asset: ailearn-linux-arm64
          - os: macos-15-intel
            asset: ailearn-macos-x64
          - os: macos-15
            asset: ailearn-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(uv run python -c 'from ailearn import __version__; print(__version__)')"
      - run: uv run python scripts/build_native.py
      - name: Smoke test bundled onboarding
        shell: bash
        run: |
          ./dist/${{ matrix.asset }} --workspace .test-tmp-native config --harness codex
          ./dist/${{ matrix.asset }} --workspace .test-tmp-native doctor
          ./dist/${{ matrix.asset }} --workspace .test-tmp-native config --harness codex
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = 'v' + (uv run python -c 'from ailearn import __version__; print(__version__)')
          ./scripts/install.ps1 -Version $version -ReleaseDirectory dist -InstallRoot "$PWD/.test-tmp-user-install" -NoModifyPath
          & "$PWD/.test-tmp-user-install/bin/ailearn.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed command failed' }
          ./scripts/install.ps1 -Version $version -ReleaseDirectory dist -InstallRoot "$PWD/.test-tmp-user-install" -NoModifyPath
      - name: Test Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export VERSION="v$(uv run python -c 'from ailearn import __version__; print(__version__)')"
          export RELEASE_DIRECTORY="$PWD/dist"
          export AILEARN_INSTALL_ROOT="$PWD/.test-tmp-user-install"
          export AILEARN_BIN_DIR="$PWD/.test-tmp-user-bin"
          sh scripts/install.sh
          "$AILEARN_BIN_DIR/ailearn" --version
          sh scripts/install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Verify tag belongs to main
        run: |
          # checkout can project a tag name directly onto its commit; fetch the
          # remote annotated object into a separate ref before checking its type.
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' "refs/tags/$RELEASE_TAG:refs/ai-lc/release-tag"
          test "$(git cat-file -t refs/ai-lc/release-tag)" = tag
          test "$(git rev-parse 'refs/ai-lc/release-tag^{}')" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* scripts/install.ps1 scripts/install.sh --verify-tag --generate-notes
